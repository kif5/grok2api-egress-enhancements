name: Build Go Linux Binary

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Build cpa-plugin for Linux (amd64)
        run: |
          cd cpa-plugin
          # 自动初始化 go.mod 解决模块缺失问题
          go mod init cpa-plugin
          # 关闭 Go Module 严格限制以支持传统编译模式
          export GO111MODULE=auto
          GOOS=linux GOARCH=amd64 go build -o grok2api-egress-enhancements-linux .
          echo "Build completed successfully"
          file grok2api-egress-enhancements-linux

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: grok2api-egress-enhancements-linux
          path: cpa-plugin/grok2api-egress-enhancements-linux
          retention-days: 7
