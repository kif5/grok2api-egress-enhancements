name: Build Go Linux Plugin (.so)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x' # 匹配文档要求的 Go 1.26+
          cache: false

      - name: Install C Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libc6-dev

      - name: Run Tests and Build Shared Library (.so)
        run: |
          cd cpa-plugin/go
          
          # 自动初始化模块依赖
          if [ ! -f go.mod ]; then
            go mod init grok2api-egress
          fi
          go mod tidy || true
          
          # 开启 CGO 编译生成 .so 动态链接库
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -trimpath -o grok2api-egress.so .
          
          echo "=== 编译产物验证 ==="
          file grok2api-egress.so
          
          # 将编译好的 .so 文件移动到根目录准备上传
          mv grok2api-egress.so $GITHUB_WORKSPACE/

      - name: Upload Linux Shared Library (.so)
        uses: actions/upload-artifact@v4
        with:
          name: grok2api-egress-so
          path: grok2api-egress.so
          retention-days: 7
