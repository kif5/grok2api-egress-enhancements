name: Build Go Linux Plugin (.so)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*' # 只要推送以 v 开头的标签（如 v1.0.0），就会自动发布到 Releases
  pull_request:
    branches: [main, master]

# 核心关键：赋予 Workflow 写入 Release 和 Contents 的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install C Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libc6-dev

      - name: Run Tests and Build Shared Library (.so)
        run: |
          cd cpa-plugin/go
          
          if [ ! -f go.mod ]; then
            go mod init grok2api-egress
          fi
          go mod tidy || true
          
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -trimpath -o grok2api-egress.so .
          
          echo "=== 编译产物验证 ==="
          file grok2api-egress.so
          
          mv grok2api-egress.so $GITHUB_WORKSPACE/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok2api-egress-so
          path: grok2api-egress.so
          retention-days: 7

      # 自动将 .so 动态库上传到 Releases
      - name: Create Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: grok2api-egress.so
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
