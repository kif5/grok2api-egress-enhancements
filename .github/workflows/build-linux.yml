name: Build Go Linux Binary

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Find Go files and Build
        run: |
          echo "=== 正在查找项目中的所有 .go 文件 ==="
          find . -name "*.go"
          
          # 寻找包含 package main 的入口文件所在目录
          MAIN_DIR=$(find . -name "*.go" -exec grep -l "package main" {} + | head -n 1 | xargs -r dirname)
          
          if [ -z "$MAIN_DIR" ]; then
            echo "错误：仓库中没有找到包含 package main 的 Go 入口代码！"
            exit 1
          fi
          
          echo "=== 找到入口目录: $MAIN_DIR ==="
          cd "$MAIN_DIR"
          
          # 如果所在目录没有 go.mod，则初始化一个
          if [ ! -f go.mod ]; then
            go mod init buildApp
          fi
          go mod tidy || true
          
          # 开始编译 Linux 二进制
          GOOS=linux GOARCH=amd64 go build -o grok2api-egress-enhancements-linux .
          echo "Build completed successfully"
          file grok2api-egress-enhancements-linux
          
          # 将编译好的文件移动回根目录，方便后续打包上传
          mv grok2api-egress-enhancements-linux $GITHUB_WORKSPACE/

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: grok2api-egress-enhancements-linux
          path: grok2api-egress-enhancements-linux
          retention-days: 7
