name: Build Go Linux Binary

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build for Linux (amd64)
        run: |
          GOOS=linux GOARCH=amd64 go build -o grok2api-egress-enhancements
          echo "Build completed successfully"
          file grok2api-egress-enhancements

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: grok2api-egress-enhancements-linux
          path: grok2api-egress-enhancements
          retention-days: 7